<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>冠脈狹窄核對</title>
<style>
:root{--bg:#fafafa;--fg:#1d1d1f;--mut:#6b6b70;--line:#d6d6db;--acc:#0b63c5;--warn:#b3261e;--ok:#1b7f3b;--card:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#161618;--fg:#ececf0;--mut:#a0a0a8;--line:#3a3a40;--acc:#6aa8ff;--warn:#ff8a80;--ok:#7ad38f;--card:#1f1f23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0 12px 0 0}
main{padding:12px 16px;max-width:1300px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.mut{color:var(--mut)}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.imgwrap{position:relative;cursor:crosshair;user-select:none}
.imgwrap img{display:block;width:100%;height:auto;border:1px solid var(--line)}
.mark{position:absolute;top:0;bottom:0;width:2px;background:var(--warn);pointer-events:none}
.mark span{position:absolute;top:-2px;left:4px;background:var(--warn);color:#fff;font-size:12px;padding:0 4px;border-radius:3px;pointer-events:auto;cursor:pointer}
.mark span:hover::after{content:' ✕'}
.ruler{position:relative;height:22px;border-top:1px solid var(--mut);margin-top:2px;font-size:11px;color:var(--mut)}
.br{position:absolute;top:0;bottom:0;border-left:1px dashed #3b82f6;pointer-events:none}
.br span{position:absolute;bottom:2px;left:2px;font-size:11px;color:#fff;background:#3b82f6;padding:0 3px;border-radius:3px}
.ca{position:absolute;top:0;height:8px;background:#f59e0b;pointer-events:none}
.segs{position:relative;height:18px;margin-top:2px;font-size:11px}
.segs div{position:absolute;top:0;height:16px;border:1px solid var(--line);text-align:center;overflow:hidden;color:var(--mut);background:var(--card);white-space:nowrap}
.segs div.hl{background:#fde68a;color:#78350f;border-color:#f59e0b;font-weight:600}
.terms{margin-top:8px;border-collapse:collapse;width:100%}
.terms td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
.loc{float:right;margin-left:12px;text-align:center;font-size:11px;color:var(--mut)}
#cprs{clear:both}
.segs div.ost{overflow:visible;border-color:#94a3b8;text-align:left;padding-left:2px}
.loc img{width:180px;border:1px solid var(--line);background:#000;cursor:zoom-in}
.loc img.big{width:420px}
.ruler i{position:absolute;top:0;height:6px;border-left:1px solid var(--mut)}
.ruler b{position:absolute;top:6px;transform:translateX(-50%);font-weight:400}
.xs{display:flex;gap:6px;flex-wrap:wrap}
.xs figure{margin:0;text-align:center;font-size:12px;color:var(--mut)}
.xs img{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);background:#000}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
.reveal{border-left:4px solid var(--acc)}
.pill{display:inline-block;padding:0 8px;border-radius:10px;border:1px solid var(--line);font-size:12px}
.done{color:var(--ok)}
label{margin-right:12px}
#drop{padding:40px;text-align:center;border:2px dashed var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <h1>冠脈狹窄核對</h1>
  <span id="who" class="mut"></span>
  <span id="prog" class="mut"></span>
  <span style="flex:1"></span>
  <button id="prev" disabled>← 上一條</button>
  <select id="jump"></select>
  <button id="next" disabled>下一條 →</button>
  <button id="export" disabled>匯出 CSV</button>
  <button id="clearAll" disabled>清除我的全部作答</button>
  <button id="switchReader" disabled>切換判讀者</button>
</header>
<main>
  <div id="drop" class="card">
    <p><b>選擇資料夾</b>：內含 <code>manifest.json</code> 與各血管的圖檔。</p>
    <p><b>模式</b>
      <label><input type="radio" name="mode" value="blind" checked> 盲讀核對（先判讀，再看報告；用於估計標籤正確率）</label>
      <label><input type="radio" name="mode" value="teach"> 教學標註（直接看報告，在圖上標出問題並寫說明；用於建立知識）</label></p>
    <p><label>判讀者代號（必填，例如 R1）<input id="readerIn" size="10" autocomplete="off" value="R1"></label></p>
    <input type="file" id="dir" webkitdirectory directory multiple>
    <p><button id="demoBtn">直接開啟示範資料（合成影像，不需下載）</button> <span class="mut" id="demoMsg"></span></p>
    <p class="mut">每位判讀者的作答分開暫存，彼此看不到；同一台電腦換人時，請輸入不同代號。</p>
    <p class="mut">所有資料只在這台電腦的瀏覽器中讀取，不會上傳。作答自動暫存在瀏覽器，完成後請按「匯出 CSV」。</p>
  </div>
  <div id="app" hidden>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b id="vid"></b> <span id="vname" class="pill"></span> <span class="mut" id="vlen"></span></div>
        <div class="mut">在血管圖上點一下＝新增一個病灶位置；再填等級與病灶性質（有斑塊但不狹窄填 0–1 級；不是斑塊造成的狹窄選心肌橋等）。</div>
      </div>
    </div>
    <div class="card">
      <div id="locBox"></div>
      <div id="angBox" style="font-size:13px;margin-bottom:4px"></div>
      <div id="contourBox" style="font-size:13px;margin-bottom:4px"></div>
      <div class="mut" id="legend" style="font-size:12px;margin-bottom:6px"></div>
      <div id="cprs"></div>
      <div class="xs" id="xs"></div>
    </div>
    <div class="card">
      <h3 style="margin:0 0 6px" id="step1Title">第一步：盲讀</h3>
      <table id="lesions"><thead><tr id="lesHead"></tr></thead><tbody></tbody></table>
      <p>
        <label>影像可判讀
          <select id="quality"><option value="">—</option><option>可</option><option>勉強</option><option>不可</option></select></label>
        <label>整條最嚴重等級
          <select id="vmax"></select></label>
        <label>信心
          <select id="conf"><option value="">—</option><option>高</option><option>中</option><option>低</option></select></label>
      </p>
      <p><button id="toReveal" class="primary">完成盲讀，顯示報告</button></p>
    </div>
    <div class="card reveal" id="revealCard" hidden>
      <h3 style="margin:0 0 6px" id="step2Title">第二步：對照報告</h3>
      <p id="reportTxt"></p>
      <p>
        <label>判定
          <select id="verdict"><option value="">—</option><option>報告正確</option><option>醫師判讀正確</option><option>解析錯誤（報告寫對，程式讀錯）</option><option>兩者都不完全對</option><option>無法判定</option></select></label>
        <label>最終等級
          <select id="final"></select></label>
      </p>
      <p><textarea id="note" rows="2" style="width:100%" placeholder="備註（可空白）"></textarea></p>
      <p><button id="save" class="primary">儲存並到下一條</button> <span id="saved" class="done"></span>
        <span style="float:right"><button id="redo">重做這條</button></span></p>
      <p class="mut" id="redoNote" hidden>這條曾重做：已看過報告，重做的盲讀結果在分析時會分開處理。</p>
    </div>
  </div>
</main>
<script>
const GRADES=['0 無','1 <25%','2 25–49%','3 50–69%','4 70–99%','5 閉塞'];
const TYPES=['鈣化斑塊','非鈣化斑塊','混合斑塊','心肌橋','支架內再狹窄','偽影（移動或鈣化暈染）','其他（請寫備註）','無法判斷'];
let M=null, files={}, idx=0, ans={}, KEY='', READER='', MODE='blind', VIEW='0,90', CONTOUR=false;
const VIEWS=[['0,90','0°／90°'],['45,135','45°／135°'],['all','全部角度']];
const TEACH=()=>MODE==='teach';
const locked=a=>!TEACH()&&a.revealed;          // blind answers freeze after the report is revealed
const reportShown=a=>TEACH()||a.revealed;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Report vocabulary: regex -> [term, Chinese explanation, segment/ostium name on the image or null]
const SEGRE=[
 [/\bost(?:ial|ium)\s+(?:and\s+\w+\s+)?(?:of\s+(?:the\s+)?)?(LM|LAD|LCX|LCx|Cx|RCA)\b|\b(LM|LAD|LCX|LCx|Cx|RCA)\s+ost(?:ium|ial)\b/gi, m=>{const v=(m[1]||m[2]).toUpperCase().replace(/^L?CX$/,'LCX');return ['ostial '+v,`${v} 開口處（約開口起 5 mm 內）`,'ostial '+v]}],
 [/\b([pmd])(LAD|Cx|LCx|LCX|RCA)\b/g, m=>{const P={p:'近段',m:'中段',d:'遠段'}[m[1]],V=m[2].toUpperCase().replace(/^L?CX$/,'LCX'),n=m[1]+(V==='LCX'?'Cx':V);return [m[0],`${V} ${P}`,n]}],
 [/\b(proximal|middle|mid|distal)\s+(LAD|LCX|LCx|Cx|RCA)\b/gi, m=>{const k=m[1].toLowerCase()[0],P={p:'近段',m:'中段',d:'遠段'}[k],V=m[2].toUpperCase().replace(/^L?CX$/,'LCX');return [m[0],`${V} ${P}`,k+(V==='LCX'?'Cx':V)]}],
 [/\b(D\d|OM\d|PDA|R-?PDA|PL[B]?|R-?PLB?|Ramus|RI|Septal\d?|M\d)\b/g, m=>{const n=m[1].toUpperCase().replace(/^R-?/,'').replace(/^M(\d)$/,'OM$1');const map={D:'對角支（LAD 的分支）',OM:'鈍緣支（LCX 的分支）',PDA:'後降支（多由 RCA 遠端分出）',PL:'後側支',PLB:'後側支',RAMUS:'中間支（LM 分出）',RI:'中間支（LM 分出）',SEPTAL:'中隔支（LAD 的分支）'};const k=Object.keys(map).find(x=>n.startsWith(x));return [m[0],(k?map[k]:'分支')+'；分支本身不在這張拉直主幹圖上，圖上只標開口（若有標註）',n]}],
];
const DESCR=[
 [/non-?calcified\s+plaques?/i,'非鈣化斑塊','管壁上 CT 值較低的軟組織增厚（大約 30–150 HU），在圖上是貼著管腔、比管腔暗的灰色區域；不像鈣化那樣亮白。容易被漏判，也容易和管壁或偽影混淆。'],
 [/partially[\s-]*calcified\s+plaques?|mixed\s+plaques?/i,'部分鈣化（混合）斑塊','同一個斑塊裡同時有灰色的軟組織和亮白的鈣化點。'],
 [/(?<!non-?|partially[\s-]*)calcified\s+plaques?/i,'鈣化斑塊','亮白色（>130 HU，常 >400 HU）的團塊，貼在管壁上；會暈開（blooming），讓管腔看起來比實際更窄。'],
 [/total\s+occlusion/i,'完全阻塞','管腔顯影中斷，一段沒有顯影劑。'],
 [/recanaliz/i,'遠端再通','阻塞段之後的血管又有顯影（側枝或再通），不代表阻塞處通暢。'],
 [/\bpatent\b/i,'通暢','沒有明顯狹窄或斑塊。'],
 [/myocardial\s+bridg|intramyocardial/i,'心肌橋','血管有一段走在心肌裡，收縮期被壓扁，可能看起來像狹窄，但通常沒有斑塊。'],
 [/\bstent/i,'支架','支架是很亮的金屬網格，會產生偽影，支架內管腔判讀較困難。'],
 [/minimal\s*\(?\s*[<＜]\s*25/i,'1 級：輕微（<25%）',''],
 [/mild\s*\(?\s*25/i,'2 級：輕度（25–49%）',''],
 [/moderate\s*\(?\s*50/i,'3 級：中度（50–69%）',''],
 [/severe\s*\(?\s*70/i,'4 級：重度（70–99%）',''],
 [/diffuse|long\s+segment/i,'瀰漫性／長段病變','病變範圍長，不是單一點；在圖上請用「範圍」標出起訖。'],
];
function reportTerms(v){
  const t=v.report_text||'', out=[], hl=new Set();
  SEGRE.forEach(([re,f])=>{for(const m of t.matchAll(re)){const [term,ex,seg]=f(m);
    const s=[...(v.segments||[]),...(v.ostia||[])].find(x=>x.name.toLowerCase()===String(seg).toLowerCase());
    const b=(v.branches||[]).find(x=>x.name===seg);
    if(s)hl.add(s.name);
    out.push([term,ex+(s?`；圖上約 ${s.from}–${s.to} mm（推算）`:b?`；開口約在 ${b.mm} mm`:'')])}});
  DESCR.forEach(([re,term,ex])=>{if(re.test(t))out.push([term,ex])});
  const seen=new Set(); return {rows:out.filter(r=>{const k=r[0].toLowerCase();if(seen.has(k))return false;seen.add(k);return true}),hl};
}
const $=id=>document.getElementById(id);
function opts(sel,arr,blank=true){sel.innerHTML=(blank?'<option value="">—</option>':'')+arr.map((g,i)=>`<option value="${i}">${g}</option>`).join('')}
function store(){try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}}
function load(){try{ans=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){ans={}}}
function url(name){const f=files[name];return f?URL.createObjectURL(f):''}

$('readerIn').addEventListener('input',()=>{$('dir').disabled=!/^[A-Za-z0-9_-]{1,20}$/.test($('readerIn').value.trim())});
$('dir').addEventListener('change',async e=>{
  READER=$('readerIn').value.trim(); if(!READER){alert('請先輸入判讀者代號');return}
  MODE=document.querySelector('input[name=mode]:checked').value;
  files={}; for(const f of e.target.files){files[f.webkitRelativePath.split('/').slice(1).join('/')]=f}
  if(!files['manifest.json']){alert('資料夾裡找不到 manifest.json');return}
  M=JSON.parse(await files['manifest.json'].text()); start();
});
$('demoBtn').onclick=async()=>{  // demo files live next to the page (GitHub Pages); real data must be opened from a local folder
  READER=$('readerIn').value.trim()||'R1'; MODE=document.querySelector('input[name=mode]:checked').value; $('demoMsg').textContent='載入中…';
  try{
    const man=await (await fetch('demo/manifest.json',{cache:'no-store'})).json(); files={};
    const names=new Set(); man.vessels.forEach(v=>{(v.cpr||[]).forEach(c=>names.add(c.file));(v.cross||[]).forEach(c=>names.add(c.file)); if(v.locator)names.add(v.locator)});
    await Promise.all([...names].map(async n=>{const r=await fetch('demo/'+n); if(r.ok)files[n]=await r.blob()}));
    M=man; start();
  }catch(e){$('demoMsg').textContent='無法載入示範資料（請用 GitHub 網址開啟，或改用「選擇檔案」選 demo 資料夾）'}
};
function start(){
  KEY='vessel_review:'+MODE+':'+(M.set_id||'set')+':'+READER;
  load(); $('drop').hidden=true; $('app').hidden=false;
  ['prev','next','export','clearAll','switchReader'].forEach(b=>$(b).disabled=false);
  $('who').textContent=(M.set_id||'')+' ／ 判讀者 '+READER+' ／ '+(TEACH()?'教學標註':'盲讀核對');
  $('step1Title').textContent=TEACH()?'標註與說明（報告已顯示在下方）':'第一步：盲讀';
  $('step2Title').textContent=TEACH()?'報告與結論':'第二步：對照報告';
  $('toReveal').hidden=TEACH(); $('redo').hidden=TEACH();
  $('lesHead').innerHTML='<th>#</th><th>位置（mm，自開口）</th>'+(TEACH()?'<th>範圍終點（mm，可空白）</th>':'')+'<th>狹窄等級</th><th>病灶性質</th>'+(TEACH()?'<th>說明（圖上的問題是什麼、為什麼）</th>':'')+'<th></th>';
  $('jump').innerHTML=M.vessels.map((v,i)=>`<option value="${i}">${i+1}. ${v.id}</option>`).join('');
  opts($('vmax'),GRADES); opts($('final'),GRADES);
  const first=M.vessels.findIndex(v=>!(ans[v.id]&&ans[v.id].saved)); show(first<0?0:first);
}

function cur(){const v=M.vessels[idx];return ans[v.id]||(ans[v.id]={lesions:[],revealed:false})}

function show(i){
  idx=Math.max(0,Math.min(M.vessels.length-1,i)); const v=M.vessels[idx], a=cur();
  $('jump').value=idx; $('vid').textContent=v.id; $('vname').textContent=v.vessel; $('vlen').textContent=`長度 ${v.length_mm} mm`;
  const done=M.vessels.filter(x=>ans[x.id]&&ans[x.id].saved).length;
  $('prog').textContent=`進度 ${done}/${M.vessels.length}`;
  $('locBox').innerHTML=v.locator?`<div class="loc"><img src="${url(v.locator)}" alt="定位圖" title="點一下放大／縮小" onclick="this.classList.toggle('big')"><br>定位圖：正面最大強度投影，紅線＝這條血管</div>`:'';
  const showCa=reportShown(a)&&(v.calcium||[]).length;
  const RT=reportShown(a)?reportTerms(v):{rows:[],hl:new Set()};
  $('legend').innerHTML=((v.branches||[]).length?'藍色虛線＝分支開口（取自 ISP 標註）。':'')+((v.segments||[]).length?'下方灰框＝分段與開口處（依分支開口推算，無分支時依長度比例，僅供參考）。':'')+(RT.hl.size?'黃框＝報告提到的位置。':'')+(showCa?'橘色短條＝鈣化（>600 HU）。':'');
  const angs=(v.cpr||[]).map(p=>p.angle).filter(x=>x!=null);
  $('angBox').innerHTML=angs.length>2?'顯示角度：'+VIEWS.map(([k,t])=>`<label><input type="radio" name="view" value="${k}" ${VIEW===k?'checked':''}> ${t}</label>`).join(' '):'';
  $('angBox').querySelectorAll('input').forEach(r=>r.onchange=()=>{VIEW=r.value;show(idx)});
  const vis=p=>angs.length<=2||p.angle==null||VIEW==='all'||VIEW.split(',').includes(String(p.angle));
  const c=$('cprs'); c.innerHTML='';
  (v.cpr||[]).filter(vis).forEach(p=>{
    const box=document.createElement('div'); box.style.marginBottom='10px';
    box.innerHTML=`<div class="mut" style="font-size:12px">${p.label||''}</div>`;
    const w=document.createElement('div'); w.className='imgwrap';
    const img=document.createElement('img'); img.src=url(p.file); img.alt=p.label||'CPR'; w.appendChild(img);
    w.addEventListener('click',ev=>{
      if(locked(a))return; const r=w.getBoundingClientRect(); const fx=(ev.clientX-r.left)/r.width;
      const mm=Math.round(v.length_mm*Math.min(1,Math.max(0,fx))*10)/10; a.lesions.push({mm,grade:'',type:'',end_mm:'',explain:''}); store(); show(idx);
    });
    a.lesions.forEach((L,k)=>{
      const e=parseFloat(L.end_mm); if(TEACH()&&e>L.mm){const s=document.createElement('div');s.style.cssText=`position:absolute;top:0;bottom:0;left:${100*L.mm/v.length_mm}%;width:${100*(Math.min(e,v.length_mm)-L.mm)/v.length_mm}%;background:rgba(179,38,30,.18);pointer-events:none`;w.appendChild(s)}
      const m=document.createElement('div');m.className='mark';m.style.left=(100*L.mm/v.length_mm)+'%';m.innerHTML=`<span title="${locked(a)?'':'點一下刪除這個病灶'}">${k+1}</span>`;
      m.querySelector('span').addEventListener('click',ev=>{ev.stopPropagation(); if(locked(a))return; a.lesions.splice(k,1); store(); show(idx)});
      w.appendChild(m)});
    (v.branches||[]).forEach(b=>{const d=document.createElement('div');d.className='br';d.style.left=(100*b.mm/v.length_mm)+'%';d.innerHTML=`<span>${esc(b.name)}</span>`;w.appendChild(d)});
    if(showCa)(v.calcium||[]).forEach(r=>{const d=document.createElement('div');d.className='ca';d.style.left=(100*r[0]/v.length_mm)+'%';d.style.width=Math.max(0.4,100*(r[1]-r[0])/v.length_mm)+'%';w.appendChild(d)});
    box.appendChild(w);
    [v.segments||[],v.ostia||[]].forEach(list=>{ if(!list.length)return; const sg=document.createElement('div');sg.className='segs';
      list.forEach(s=>{const d=document.createElement('div');d.style.left=(100*s.from/v.length_mm)+'%';d.style.width=(100*(s.to-s.from)/v.length_mm)+'%';d.textContent=s.name;d.title=`${s.name} ${s.from}–${s.to} mm（推算）`;d.className=(list===v.ostia?'ost ':'')+(RT.hl.has(s.name)?'hl':'');sg.appendChild(d)});
      box.appendChild(sg)});
    const ru=document.createElement('div'); ru.className='ruler'; const step=v.length_mm>120?20:10;
    for(let mm=0;mm<=v.length_mm;mm+=step){ru.innerHTML+=`<i style="left:${100*mm/v.length_mm}%"></i><b style="left:${100*mm/v.length_mm}%">${mm}</b>`}
    box.appendChild(ru); c.appendChild(box);
  });
  const canContour=reportShown(a)&&(v.cross||[]).some(x=>x.file_contour);
  $('contourBox').innerHTML=canContour?`<label><input type="checkbox" id="contourChk" ${CONTOUR?'checked':''}> 顯示自動輪廓（綠線＝管腔／內徑，黃線＝血管外壁／外徑，兩線之間＝斑塊；程式自動估計，可能有誤，僅供參考）</label>`:'';
  if(canContour)$('contourChk').onchange=e=>{CONTOUR=e.target.checked;show(idx)};
  const on=canContour&&CONTOUR;
  $('xs').innerHTML=(v.cross||[]).map(x=>`<figure><img src="${url(on&&x.file_contour?x.file_contour:x.file)}" alt="${x.mm} mm"><figcaption>${x.mm} mm`
    +(on&&(x.lumen_d!=null||x.outer_d!=null)?`<br><span title="等效直徑（由面積換算），自動估計；外徑受 CT 邊界模糊影響常偏大">內 ${x.lumen_d??'—'}／外 ${x.outer_d??'—'} mm</span>`:'')
    +`</figcaption></figure>`).join('');
  const tb=$('lesions').querySelector('tbody'); tb.innerHTML='';
  a.lesions.forEach((L,k)=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${k+1}</td><td>${L.mm}</td>`+(TEACH()?`<td><input data-k="${k}" data-f="end_mm" size="6" value="${esc(L.end_mm)}"></td>`:'')
      +`<td><select data-k="${k}" data-f="grade"></select></td><td><select data-k="${k}" data-f="type"></select></td>`
      +(TEACH()?`<td><textarea data-k="${k}" data-f="explain" rows="2" style="width:100%;min-width:260px">${esc(L.explain)}</textarea></td>`:'')
      +`<td><button data-del="${k}">刪除</button></td>`;
    tb.appendChild(tr);
    const g=tr.querySelector('[data-f=grade]'); opts(g,GRADES); g.value=L.grade;
    const t=tr.querySelector('[data-f=type]'); t.innerHTML='<option value="">—</option>'+TYPES.map(x=>`<option>${x}</option>`).join(''); t.value=L.type;
    tr.querySelectorAll('select,input,textarea').forEach(s=>{s.disabled=locked(a);
      const upd=()=>{a.lesions[+s.dataset.k][s.dataset.f]=s.value;store()};
      if(s.tagName==='SELECT')s.onchange=upd; else {s.oninput=upd; if(s.dataset.f==='end_mm')s.onchange=()=>{upd();show(idx)}}});
    tr.querySelector('[data-del]').disabled=locked(a);
    tr.querySelector('[data-del]').onclick=()=>{a.lesions.splice(k,1);store();show(idx)};
  });
  if(!a.lesions.length)tb.innerHTML=`<tr><td colspan="${TEACH()?7:5}" class="mut">尚未標記。在血管圖上點一下新增；沒有狹窄也可以不標。</td></tr>`;
  $('quality').value=a.quality||''; $('vmax').value=a.vmax??''; $('conf').value=a.conf||'';
  ['quality','vmax','conf'].forEach(id=>{$(id).disabled=locked(a);$(id).onchange=()=>{a[id]=$(id).value;store()}});
  $('toReveal').disabled=a.revealed;
  $('revealCard').hidden=!reportShown(a);
  $('redoNote').hidden=!a.redo_count;
  if(reportShown(a)){
    $('reportTxt').innerHTML=(v.report_text?`<div style="white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px"><span class="mut">報告原文（與此血管相關的句子）</span><br>${esc(v.report_text)}</div>`:'')
      +`解析結果：<b>${v.report_grade!=null?GRADES[v.report_grade]:'未提及'}</b>`+(v.report_segment?`，分段 <b>${esc(v.report_segment)}</b>`:'')+(v.report_note?`<br><span class="mut">${esc(v.report_note)}</span>`:'')
      +(RT.rows.length?`<table class="terms"><tr><td colspan="2" class="mut">報告用語說明（位置為推算；提到的分段已在血管圖下方以黃色標出）</td></tr>`+RT.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')+'</table>':'');
    $('verdict').value=a.verdict||''; $('final').value=a.final??''; $('note').value=a.note||'';
    $('saved').textContent=a.saved?'已儲存':'';
  }
}
$('toReveal').onclick=()=>{const a=cur();
  if(!a.quality||a.vmax===undefined||a.vmax===''){alert('請先填「影像可判讀」與「整條最嚴重等級」');return}
  if(a.lesions.some(L=>L.grade===''||L.type==='')){alert('每個病灶都要填等級與病灶性質');return}
  a.revealed=true; a.reveal_time=new Date().toISOString(); store(); show(idx)};
$('verdict').onchange=()=>{const a=cur(),v=M.vessels[idx];a.verdict=$('verdict').value;
  if(a.verdict==='報告正確'&&v.report_grade!=null){a.final=String(v.report_grade);$('final').value=a.final}
  else if(a.verdict==='醫師判讀正確'&&a.vmax!==''&&a.vmax!=null){a.final=String(a.vmax);$('final').value=a.final}
  store()};
$('final').onchange=()=>{cur().final=$('final').value;store()};
$('note').oninput=()=>{cur().note=$('note').value;store()};
$('save').onclick=()=>{const a=cur(); if(!TEACH()&&(!a.verdict||a.final===''||a.final===undefined)){alert('請填「判定」與「最終等級」');return}
  a.saved=new Date().toISOString(); store(); show(idx+1)};
$('redo').onclick=()=>{const v=M.vessels[idx],a=cur();
  if(!confirm(`確定要清掉 ${v.id} 的作答重做嗎？\n你已看過報告，重做的結果會標記為「重做」。`))return;
  ans[v.id]={lesions:[],revealed:false,redo_count:(a.redo_count||0)+1}; store(); show(idx)};
$('clearAll').onclick=()=>{
  if(!confirm(`確定要清除判讀者 ${READER} 在這個資料夾的全部作答嗎？\n建議先按「匯出 CSV」備份。清除後無法復原。`))return;
  ans={}; store(); show(0)};
$('switchReader').onclick=()=>{ if(!confirm('切換判讀者？目前的作答已自動暫存，之後用同一代號可以接著做。'))return; location.reload()};
$('prev').onclick=()=>show(idx-1); $('next').onclick=()=>show(idx+1); $('jump').onchange=e=>show(+e.target.value);
$('export').onclick=()=>{
  const rows=[['vessel_id','vessel','reader','mode','quality','reader_max_grade','confidence','lesion_no','lesion_mm','lesion_end_mm','lesion_grade','lesion_nature','lesion_explain','report_grade','report_segment','verdict','final_grade','note','reveal_time','saved','redo_count']];
  M.vessels.forEach(v=>{const a=ans[v.id]; if(!a)return; const Ls=a.lesions.length?a.lesions:[{}];
    Ls.forEach((L,k)=>rows.push([v.id,v.vessel,READER,MODE,a.quality||'',a.vmax??'',a.conf||'',a.lesions.length?k+1:'',L.mm??'',L.end_mm??'',L.grade??'',L.type??'',(L.explain||'').replace(/\s+/g,' '),v.report_grade??'',v.report_segment||'',a.verdict||'',a.final??'',(a.note||'').replace(/\s+/g,' '),a.reveal_time||'',a.saved||'',a.redo_count||0]))});
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  const b=new Blob([csv],{type:'text/csv'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b);
  l.download=`vessel_review_${MODE}_${M.set_id||'set'}_${READER}_${new Date().toISOString().slice(0,10)}.csv`; l.click()};
</script>
</body>
</html>
